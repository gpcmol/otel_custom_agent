name: Publish image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ toLower(github.repository) }}:${{ github.ref_name }}
            ghcr.io/${{ toLower(github.repository) }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep only the latest five releases
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: otel_custom_agent
        run: |
          set -euo pipefail

          # Each release upload has a vX.Y.Z tag. Keep the five highest versions.
          RELEASES="$(gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | [.id, (.metadata.container.tags[]? // "")] | @tsv' \
            | awk -F '\t' '$2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 "\t" $2 }' \
            | sort -t $'\t' -k2,2Vr)"

          KEEP_IDS="$(printf '%s\n' "$RELEASES" | head -n 5 | cut -f1 | sort -u)"
          DELETE_IDS="$(printf '%s\n' "$RELEASES" | cut -f1 | sort -u)"

          while IFS= read -r VERSION_ID; do
            [[ -z "$VERSION_ID" ]] && continue
            if ! grep -Fxq "$VERSION_ID" <<< "$KEEP_IDS"; then
              echo "Deleting old release package version ${VERSION_ID}"
              gh api --method DELETE \
                "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
            fi
          done <<< "$DELETE_IDS"
