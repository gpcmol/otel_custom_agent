apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: default
data:
  agent-config.xml: |
    <configuration>
        <static>
            <attribute key="debug" value="true"/>
            <attribute key="domain" value="cars"/>
            <attribute key="team" value="winning"/>
            <attribute key="environment" value="production"/>
            <attribute key="region" value="eu-west"/>
            <attribute key="service" value="garage"/>
        </static>
        <dynamic>
            <enrich class="com.example.Garage" method="park"
                    expr="($arg0.brand == 'bmw' or $arg0.brand == 'audi' or $arg0.brand == 'vw' or $arg0.brand == 'mercedes' or $arg0.brand == 'toyota' or $arg0.brand == 'honda' or $arg0.brand == 'ford' or $arg0.brand == 'renault') and $arg0.mileage gt 0">
                <attribute key="brand" path="$arg0.brand"/>
                <attribute key="model" path="$arg0.model"/>
                <attribute key="year" path="$arg0.year"/>
                <attribute key="color" path="$arg0.color"/>
                <attribute key="licensePlate" path="$arg0.licensePlate"/>
                <attribute key="vin" path="$arg0.vin"/>
                <attribute key="mileage" path="$arg0.mileage"/>
                <attribute key="fuelType" path="$arg0.fuelType"/>
                <attribute key="transmission" path="$arg0.transmission"/>
                <attribute key="passengers" path="$arg0.passengers[1].name"/>
                <attribute key="accepted" path="$return.accepted"/>
                <attribute key="status" path="$return.status"/>
            </enrich>
        </dynamic>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: default
  labels:
    app: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: localhost:5001/otel-custom-agent-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_CUSTOM_AGENT_CONFIG_FILE
              value: /etc/otel-custom-agent/agent-config.xml
          volumeMounts:
            - name: agent-config
              mountPath: /etc/otel-custom-agent
              readOnly: true
      volumes:
        - name: agent-config
          configMap:
            name: agent-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: default
spec:
  selector:
    app: garage
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
